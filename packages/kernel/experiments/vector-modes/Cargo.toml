# E327: execution modes for scoring a vector list's int8 codes (the inner
# loop of an IVF query, E323 and E325): Rust as written, Rust with
# independent lanes, integer queries, AVX2, clang and MLIR's vector
# dialect. A separate crate so the kernel's builds do not depend on it.
[package]
name = "vector-modes"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
libc = "=0.2.189"
tempfile = "3.27.0"
# E423 (`-- matrix`): the kernel's interpreter (a stored WASM function run
# by `Repo::evaluate`) and Cranelift (as net-jit pins it) as modes.
ikam-kernel = { path = "../.." }
cranelift-codegen = "=0.137.1"
cranelift-frontend = "=0.137.1"
cranelift-jit = "=0.137.1"
cranelift-module = "=0.137.1"
cranelift-native = "=0.137.1"
wat = "1.260.0"

[profile.release]
debug = false
