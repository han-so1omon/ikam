[package]
name = "ikam-interp"
version = "0.1.0"
edition = "2024"
description = "Deterministic integer stack machine run by the IKAM kernel as a WASM reconstruction function"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1

# Built on its own (`cargo build --release --target wasm32-unknown-unknown`).
[workspace]
