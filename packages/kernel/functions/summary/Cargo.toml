[package]
name = "ikam-summary"
version = "0.1.0"
edition = "2024"
description = "A fragment's summary (word counts, dollar figures, dates, headings, list items) as a WASM derivation function (E186)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1

# Built on its own (`cargo build --release --target wasm32-unknown-unknown`).
[workspace]
