[package]
name = "ikam-kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
crc32fast = "=1.5.2"
brotli = "=9.0.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
# Reconstruction depends on exact compressor and interpreter behaviour:
# keep these pinned; see container::tests::deflate_output_is_pinned.
libz-sys = { version = "=1.1.29", features = ["static"] }
memchr = "2.8.3"
ppmd-rust = "=1.5.0"
similar = "3.2.0"
thiserror = "2.0.21"
wasmi = { version = "=2.0.0", features = ["auto-dispatch", "deterministic"] }
xz2 = { version = "=0.1.7", features = ["static"] }
zstd = { version = "0.14.0", features = ["experimental"] }

# Optional store backends (E122 bake-off). Each is a swappable `Store`;
# the default build uses none of them.
fjall = { version = "3.1.13", optional = true }
heed = { version = "0.22", optional = true }
redb = { version = "4.5.0", optional = true }
rocksdb = { version = "0.25.0", optional = true, default-features = false, features = ["lz4", "zstd"] }
rusqlite = { version = "0.41.1", optional = true, features = ["bundled"] }

# E244: Tantivy, for comparing the built-in word index with it. Only the
# `search_view` example uses it; the default build does not.
tantivy = { version = "=0.24.2", optional = true }
tantivy-fst = { version = "=0.5.0", optional = true }
hnsw_rs = { version = "0.3", optional = true }

# E227: one syncfs on Linux, and a plain fsync on Apple systems (where
# std's sync_all is F_FULLFSYNC), for FsStore::open_deferred.
[target.'cfg(any(target_os = "linux", target_vendor = "apple"))'.dependencies]
libc = "=0.2.189"

[features]
store-fjall = ["dep:fjall"]
store-lmdb = ["dep:heed"]
store-redb = ["dep:redb"]
store-rocksdb = ["dep:rocksdb"]
store-sqlite = ["dep:rusqlite"]
stores = ["store-fjall", "store-lmdb", "store-redb", "store-rocksdb", "store-sqlite"]
search-tantivy = ["dep:tantivy", "dep:tantivy-fst"]
# E253: HNSW (hnsw_rs) for the vector benchmark only
vectors-hnsw = ["dep:hnsw_rs"]

[dev-dependencies]
libc = "=0.2.189"
proptest = "1.11.0"
tempfile = "3.27.0"
wat = "1.260.0"

[[bin]]
name = "ikam"
path = "src/bin/ikam/main.rs"

# Dependencies (wasmi, zlib, zstd) are far slower unoptimized; tests run them heavily.
[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "search_view"
required-features = ["search-tantivy"]

[[example]]
name = "search_segments"
required-features = ["search-tantivy"]

[[example]]
name = "search_tantivy_view"
required-features = ["search-tantivy"]

[[example]]
name = "vector_views"
required-features = ["vectors-hnsw"]

[[example]]
name = "hybrid"
required-features = ["search-tantivy", "vectors-hnsw"]

[[example]]
name = "vector_real"
required-features = ["vectors-hnsw"]

[[example]]
name = "hybrid_real"
required-features = ["search-tantivy"]

[[example]]
name = "fusion_tune"
required-features = ["search-tantivy"]

[[example]]
name = "stores"
required-features = ["stores"]
test = true
